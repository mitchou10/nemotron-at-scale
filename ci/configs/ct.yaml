remote: origin
target-branch: main
# The chart sits at the repository root as `helm/`, so the scanned directory is the root itself;
# chart-testing treats each subdirectory holding a Chart.yaml as a chart and ignores the rest.
chart-dirs:
  - .
# Only the plain-HTTP dependency repositories need declaring.
chart-repos:
  - cnpg=https://cloudnative-pg.github.io/charts
# The chart version is bumped by the CD (bump-chart) when a release is cut, not by hand in each pull
# request: requiring an increment here would fail every change to the chart.
check-version-increment: false
helm-extra-args: ""
validate-chart-schema: true
validate-chart-values: true
validate-maintainers: false
validate-yaml: true
exclude-deprecated: true
excluded-charts: []
debug: true
