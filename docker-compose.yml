# Docker Compose for nemotron (run from the repository root; config comes from ./.env)
# Usage:
#   Development:  docker compose --profile dev up
#   Production:   docker compose up
#
# Live transcription runs in separate instances that REGISTER THEMSELVES in the backend
# (PUT /api/v1/registry/instances/<id>, a heartbeat every 10 s, removed after 30 s of silence).
# The backend gateway measures their latency and load and routes each audio stream to the best one.
# `vosk_service` and `tts_service` register on their own; `nemo-speech serve` (NeMo-Speech.cpp) has no
# such feature, so a small `*-registrar` service next to it does it with curl:
#   CPU:  docker compose --profile cpu up --build
#   GPU:  docker compose --profile gpu up --build     (NVIDIA container toolkit)
#   Vosk (Kaldi, light CPU model, own service in ./vosk_service): --profile vosk
#     VOSK_MODEL_NAME picks the model/language (default: vosk-model-small-fr-0.22)
#   Any mix works, e.g. --profile cpu --profile vosk: the gateway fills instances by priority (gpu, cpu, then vosk)
#   More instances:  --scale asr-vosk=4  (each replica registers itself). A scaled nemo-speech service
#     is registered as one instance under its service name: raise its limit with the registrar's
#     `max_streams`.
#   Text to speech (Piper, OpenAI-compatible): --profile tts (registers itself)
#     POST http://localhost:8081/v1/audio/speech (service) or /api/v1/audio/speech (backend relay)
#   Status: GET /api/v1/asr/instances
#   Metrics: GET /metrics (Prometheus); UI with --profile monitoring on http://localhost:9090

name: nemotron

services:
  db:
    image: postgres:16-alpine
    container_name: nemotron-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nemotron
      POSTGRES_PASSWORD: nemotron
      POSTGRES_DB: nemotron
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemotron"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nemotron-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASR_ENABLED: ${ASR_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    container_name: nemotron-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.0.1
    container_name: nemotron-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  asr-model:
    image: curlimages/curl:8.10.1
    user: root
    volumes:
      - asr_models:/models
    entrypoint: ["sh", "-c"]
    command:
      - |
        f="/models/$${ASR_MODEL_FILE}"
        [ -s "$$f" ] || { curl -fL --retry 3 -o "$$f.part" "$${ASR_MODEL_URL}" && mv "$$f.part" "$$f"; }
    environment:
      ASR_MODEL_FILE: ${ASR_MODEL_FILE:-nemotron-speech-streaming-en-0.6b.q8_0.gguf}
      ASR_MODEL_URL: ${ASR_MODEL_URL:-https://huggingface.co/nvidia/nemotron-speech-streaming-en-0.6b/resolve/ebe59e5a817142986528bbbee5dba8db7b38ed50/nemotron-speech-streaming-en-0.6b.q8_0.gguf}

  asr-cpu:
    profiles: ["cpu"]
    image: nemo-speech-runtime:cpu
    build:
      context: https://github.com/NVIDIA/NeMo-Speech.cpp.git#${NEMO_SPEECH_REF:-main}
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        ENABLE_CUDA: "OFF"
        ENABLE_CUDA_GRAPHS: "OFF"
        ENABLE_GGML_PATCHES: "OFF"
        ENABLE_GRPC: "OFF"
        ENABLE_FLASHLIGHT: "OFF"
        ENABLE_NORM: "OFF"
    restart: unless-stopped
    environment:
      NEMO_SPEECH_ASR_BACKEND_GPU: "-1"
      # each live stream holds one worker thread: this is the hard cap on streams per instance
      NEMO_SPEECH_HTTP_THREADS: ${ASR_HTTP_THREADS:-32}
    volumes:
      - asr_models:/models:ro
    command:
      - serve
      - --host
      - 0.0.0.0
      - --asr-model
      - /models/${ASR_MODEL_FILE:-nemotron-speech-streaming-en-0.6b.q8_0.gguf}
    depends_on:
      asr-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nemo-speech", "health", "--url", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Registers asr-cpu in the backend while it answers /ready, and unregisters when stopped.
  asr-cpu-registrar:
    profiles: ["cpu"]
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REGISTRY_URL: http://backend:8000
      REGISTRY_TOKEN: ${REGISTRY_TOKEN:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        id=asr-cpu
        endpoint="$$REGISTRY_URL/api/v1/registry/instances/$$id"
        auth="Authorization: Bearer $$REGISTRY_TOKEN"
        trap 'curl -s -X DELETE -H "$$auth" "$$endpoint"; exit 0' TERM INT
        while true; do
          if curl -fs http://asr-cpu:8080/ready >/dev/null; then
            curl -fsS -X PUT -H "$$auth" -H 'Content-Type: application/json' \
              -d '{"kind": "nemo", "url": "ws://asr-cpu:8080/v1/audio/transcriptions/realtime", "max_streams": 4, "priority": 1}' \
              "$$endpoint" >/dev/null || echo "registration failed"
          fi
          sleep 10 & wait $$!
        done

  # Registers asr-gpu in the backend while it answers /ready, and unregisters when stopped.
  asr-gpu-registrar:
    profiles: ["gpu"]
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REGISTRY_URL: http://backend:8000
      REGISTRY_TOKEN: ${REGISTRY_TOKEN:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        id=asr-gpu
        endpoint="$$REGISTRY_URL/api/v1/registry/instances/$$id"
        auth="Authorization: Bearer $$REGISTRY_TOKEN"
        trap 'curl -s -X DELETE -H "$$auth" "$$endpoint"; exit 0' TERM INT
        while true; do
          if curl -fs http://asr-gpu:8080/ready >/dev/null; then
            curl -fsS -X PUT -H "$$auth" -H 'Content-Type: application/json' \
              -d '{"kind": "nemo", "url": "ws://asr-gpu:8080/v1/audio/transcriptions/realtime", "max_streams": 16, "priority": 0}' \
              "$$endpoint" >/dev/null || echo "registration failed"
          fi
          sleep 10 & wait $$!
        done

  asr-vosk:
    profiles: ["vosk"]
    image: vosk-service:latest
    build:
      context: ./vosk_service
    restart: unless-stopped
    environment:
      VOSK_MODEL_NAME: ${VOSK_MODEL_NAME:-vosk-model-small-fr-0.22}
      # stream limit = CPU limit below x VOSK_STREAMS_PER_CPU (measured capacity: ~4 per CPU);
      # set VOSK_MAX_STREAMS to force a value
      VOSK_STREAMS_PER_CPU: ${VOSK_STREAMS_PER_CPU:-3}
      VOSK_MAX_STREAMS: ${VOSK_MAX_STREAMS:-}
      VOSK_ENDPOINTING: ${VOSK_ENDPOINTING:-false}
      VOSK_REGISTRY_URL: http://backend:8000
      VOSK_REGISTRY_TOKEN: ${REGISTRY_TOKEN:-}
      VOSK_REGISTRY_PRIORITY: 2
    volumes:
      - vosk_models:/models
    # The container is bounded, and the service sizes its limits from it
    deploy:
      resources:
        limits:
          cpus: "${VOSK_CPUS:-4}"
          memory: ${VOSK_MEMORY:-2g}

  # Text to speech (Piper, OpenAI-compatible): docker compose --profile tts up
  # The image ships fr_FR-siwis-medium. Other voices (TTS_VOICES, comma-separated) are downloaded once
  # into the tts_voices volume (a new volume starts with the voices of the image).
  tts:
    profiles: ["tts"]
    image: tts-service:latest
    build:
      context: ./tts_service
    container_name: nemotron-tts
    restart: unless-stopped
    environment:
      TTS_VOICES: ${TTS_VOICES:-fr_FR-siwis-medium}
      TTS_MAX_REQUESTS: ${TTS_MAX_REQUESTS:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_REGISTRY_URL: http://backend:8000
      TTS_REGISTRY_TOKEN: ${REGISTRY_TOKEN:-}
    ports:
      - "${TTS_PORT:-8081}:8080"
    volumes:
      - tts_voices:/voices
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  asr-gpu:
    profiles: ["gpu"]
    image: nemo-speech-runtime:gpu
    build:
      context: https://github.com/NVIDIA/NeMo-Speech.cpp.git#${NEMO_SPEECH_REF:-main}
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        ENABLE_CUDA: "ON"
        ENABLE_GGML_PATCHES: "OFF"
        ENABLE_GRPC: "OFF"
        ENABLE_FLASHLIGHT: "OFF"
        ENABLE_NORM: "OFF"
    restart: unless-stopped
    environment:
      NEMO_SPEECH_HTTP_THREADS: ${ASR_HTTP_THREADS:-32}
    volumes:
      - asr_models:/models:ro
    command:
      - serve
      - --host
      - 0.0.0.0
      - --asr-model
      - /models/${ASR_MODEL_FILE:-nemotron-speech-streaming-en-0.6b.q8_0.gguf}
    depends_on:
      asr-model:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "nemo-speech", "health", "--url", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nemotron-backend-dev
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  vosk_models:
  tts_voices:
  asr_models:
  prometheus_data:
