[project]
name = "vosk-service"
version = "0.2.0-rc"
description = "Standalone Vosk (Kaldi) speech-to-text server with nemo-speech-like HTTP and realtime WebSocket routes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "vosk>=0.3.45",
    "numpy>=1.26.0",
    "python-multipart>=0.0.17",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q --cov=app --cov-report=term-missing"

[tool.coverage.run]
omit = ["app/vosk_engine.py"]
