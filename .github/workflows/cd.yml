name: CD

# Release and delivery, driven by release-please (Conventional Commits) through the shared workflows of
# Mitchou10/github-workflow (pinned to @v0):
#
#   push to main  -> release-please opens/updates a "chore(main): release X.Y.Z" pull request;
#                    merging it tags the release, updates CHANGELOG.md and the versions in the
#                    pyproject.toml files, then builds and pushes the images to GHCR.
#   push to dev   -> same flow for release candidates (X.Y.Z-rc.N). The `dev` branch always exists:
#                    after each release it is created from main if missing, or rebased on main.
#
# One-time repository setup (Settings > Actions > General): allow "Read and write permissions" and
# tick "Allow GitHub Actions to create and approve pull requests", or release-please cannot open its
# pull request. See the README, section "CI/CD et releases".

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# Releases must never overlap: two pushes landing close together would run two release jobs on the
# same branch. Queue instead of cancel - aborting a release midway is worse than making it wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: Mitchou10/github-workflow/.github/workflows/release-please.yml@v0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      ENABLE_PRERELEASE: true
      RELEASE_CONFIG_FILE: .github/releases/release-please-config-release.json
      RELEASE_MANIFEST_FILE: .github/releases/.release-please-manifest.json
      PRERELEASE_CONFIG_FILE: .github/releases/release-please-config-prerelease.json
      PRERELEASE_MANIFEST_FILE: .github/releases/.release-please-manifest-prerelease.json
    # Optional GitHub App: without it the release pull request is opened with GITHUB_TOKEN, which
    # does not retrigger CI on it.
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Images are ghcr.io/<owner>/<repository>/<image>:<tag>. Names must be lower case, and expressions
  # cannot lower-case a string.
  image-prefix:
    name: Image name
    runs-on: ubuntu-latest
    needs:
      - release
    if: ${{ needs.release.outputs.release-created == 'true' }}
    permissions: {}
    outputs:
      prefix: ${{ steps.name.outputs.prefix }}
    steps:
      - id: name
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # Delivery: the images are built and pushed to GHCR only when a release was actually created.
  build-docker:
    name: Publish ${{ matrix.service.name }}
    needs:
      - release
      - image-prefix
    if: ${{ needs.release.outputs.release-created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: vosk-service
            context: vosk_service
            dockerfile: vosk_service/Dockerfile
          - name: tts-service
            context: tts_service
            dockerfile: tts_service/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    uses: Mitchou10/github-workflow/.github/workflows/build-docker.yml@v0
    permissions:
      contents: read
      packages: write
    with:
      IMAGE_NAME: ${{ needs.image-prefix.outputs.prefix }}/${{ matrix.service.name }}
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      LATEST_TAG: ${{ github.ref_name == 'main' }}
      CONTEXT: ${{ matrix.service.context }}
      DOCKERFILE: ${{ matrix.service.dockerfile }}
      TARGET: runtime

  # Report only: findings in the base image should not turn a published release red.
  scan-trivy-image:
    name: Scan ${{ matrix.service }}
    needs:
      - release
      - image-prefix
      - build-docker
    if: ${{ needs.release.outputs.release-created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - vosk-service
          - tts-service
          - frontend
    uses: Mitchou10/github-workflow/.github/workflows/scan-trivy.yml@v0
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      SCAN_TYPE: image
      TARGET: ${{ needs.image-prefix.outputs.prefix }}/${{ matrix.service }}:${{ needs.release.outputs.version }}
      FAIL_ON_FINDINGS: false
      SECURITY_TAB: true
      CATEGORY: trivy-image-${{ matrix.service }}

  # The chart ships with the code: the bump (appVersion = released version, chart version on its own
  # line, helm-docs README) is committed straight onto the branch, not through a pull request.
  bump-chart:
    name: Bump chart
    needs:
      - release
      - build-docker
    if: ${{ needs.release.outputs.release-created == 'true' }}
    uses: dnum-mi/fabnum-cicd/.github/workflows/update-helm-chart.yml@v0
    permissions:
      contents: write
      pull-requests: write
    with:
      RUN_MODE: local
      CHART_DIR: ./
      CHART_NAME: helm
      APP_VERSION: ${{ needs.release.outputs.version }}

  # Package the exact commit bump-chart just pushed and push it to GHCR as an OCI artifact.
  release-chart:
    name: Release chart
    needs:
      - release
      - build-docker
      - bump-chart
    if: ${{ needs.release.outputs.release-created == 'true' }}
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-helm-local.yml@v0
    permissions:
      contents: read
      packages: write
    with:
      CHARTS_DIR: ./
      CHART_NAME: helm
      CHECKOUT_REF: ${{ needs.bump-chart.outputs.commit-sha }}

  # Last on purpose: a release lands commits on main (release-please's, and bump-chart's) that dev does
  # not have yet, and dev computes its next release candidate from that base. Only the jobs that commit
  # are in `needs`: a failed build or publish must not leave dev stale.
  sync-prerelease-branch:
    name: Sync prerelease branch
    needs:
      - release
      - bump-chart
    if: ${{ github.ref_name == 'main' && needs.release.outputs.release-created == 'true' }}
    uses: Mitchou10/github-workflow/.github/workflows/sync-prerelease-branch.yml@v0
    permissions:
      contents: write
