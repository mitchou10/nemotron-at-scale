name: CD

# Release and delivery, driven by release-please (Conventional Commits), self-contained:
#
#   push to main  -> release-please opens/updates a "chore(main): release X.Y.Z" pull request;
#                    merging it tags the release, updates CHANGELOG.md and the versions in the
#                    pyproject.toml files, then builds and pushes the images to GHCR.
#   push to dev   -> same flow for release candidates (X.Y.Z-rc.N), only when the repository
#                    variable ENABLE_PRERELEASE is "true" (Settings > Secrets and variables > Actions >
#                    Variables) and a `dev` branch exists. Off by default: main is the only branch.
#
# One-time repository setup (Settings > Actions > General): allow "Read and write permissions" and
# tick "Allow GitHub Actions to create and approve pull requests", or release-please cannot open its
# pull request. See the README, section "CI/CD et releases".

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# Releases must never overlap: two pushes landing close together would run two release jobs on the
# same branch. Queue instead of cancel - aborting a release midway is worse than making it wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: main
  PRERELEASE_BRANCH: dev
  RELEASE_CONFIG_FILE: .github/releases/release-please-config-release.json
  RELEASE_MANIFEST_FILE: .github/releases/.release-please-manifest.json
  PRERELEASE_CONFIG_FILE: .github/releases/release-please-config-prerelease.json
  PRERELEASE_MANIFEST_FILE: .github/releases/.release-please-manifest-prerelease.json

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # `env` is not available here, so the branch name is written out: keep it equal to RELEASE_BRANCH.
    if: ${{ github.ref_name == 'main' || vars.ENABLE_PRERELEASE == 'true' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    env:
      # Optional GitHub App: without it the release pull request is opened with GITHUB_TOKEN, which
      # does not retrigger CI on it. Add APP_CLIENT_ID and APP_PRIVATE_KEY secrets to change that.
      HAS_APP_AUTH: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: ${{ env.HAS_APP_AUTH == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release new version
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          target-branch: ${{ github.ref_name }}
          config-file: ${{ (github.ref_name == env.PRERELEASE_BRANCH && env.PRERELEASE_CONFIG_FILE) || env.RELEASE_CONFIG_FILE }}
          manifest-file: ${{ (github.ref_name == env.PRERELEASE_BRANCH && env.PRERELEASE_MANIFEST_FILE) || env.RELEASE_MANIFEST_FILE }}

      # Keeps the two manifests equal on the release pull request, so that once it is merged the
      # prerelease line restarts from the version that was just released.
      - name: Keep the prerelease manifest in step with the release manifest
        if: ${{ vars.ENABLE_PRERELEASE == 'true' && github.ref_name == env.RELEASE_BRANCH && steps.release.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          branch="release-please--branches--${GITHUB_REF_NAME}"
          # Same-repository pull requests only: a fork could name its branch anything.
          number=$(gh pr list --state open --base "$GITHUB_REF_NAME" --head "$branch" \
            --json number,isCrossRepository --jq '.[] | select(.isCrossRepository == false) | .number' | head -n1)
          if [ -z "$number" ]; then
            echo "No open release pull request on '$GITHUB_REF_NAME', nothing to synchronise"
            exit 0
          fi

          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          if [ -f "$PRERELEASE_MANIFEST_FILE" ] && cmp -s "$RELEASE_MANIFEST_FILE" "$PRERELEASE_MANIFEST_FILE"; then
            echo "Manifests already in step on '$branch'"
            exit 0
          fi
          cp "$RELEASE_MANIFEST_FILE" "$PRERELEASE_MANIFEST_FILE"
          git add "$PRERELEASE_MANIFEST_FILE"
          git commit --amend --no-edit
          git push --force-with-lease origin "$branch"

  # Delivery: the images are built and pushed to GHCR only when a release was actually created.
  build-docker:
    name: Publish ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs:
      - release
    if: ${{ needs.release.outputs.release-created == 'true' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: vosk-service
            context: vosk_service
            dockerfile: vosk_service/Dockerfile
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service.name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.service.name }}

  # Last on purpose: a release lands commits on main that dev does not have yet, and dev computes its
  # next release candidate from that base. Only when the prerelease flow is enabled.
  sync-prerelease-branch:
    name: Sync prerelease branch
    runs-on: ubuntu-latest
    needs:
      - release
    if: ${{ vars.ENABLE_PRERELEASE == 'true' && github.ref_name == 'main' && needs.release.outputs.release-created == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bring the prerelease branch up to date with the release branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if ! git ls-remote --exit-code --heads origin "$PRERELEASE_BRANCH" >/dev/null 2>&1; then
            echo "'$PRERELEASE_BRANCH' does not exist, creating it from '$RELEASE_BRANCH'"
            git push origin "origin/$RELEASE_BRANCH:refs/heads/$PRERELEASE_BRANCH"
            exit 0
          fi

          git fetch origin "$RELEASE_BRANCH" "$PRERELEASE_BRANCH"
          git checkout -B "$PRERELEASE_BRANCH" "origin/$PRERELEASE_BRANCH"
          if git rebase "origin/$RELEASE_BRANCH"; then
            git push --force-with-lease origin "$PRERELEASE_BRANCH"
          else
            git rebase --abort || true
            echo "::error::Rebasing '$PRERELEASE_BRANCH' onto '$RELEASE_BRANCH' hit conflicts: resolve it by hand, or the next release candidate is computed from a stale base."
            exit 1
          fi
