name: CI

# Pull request checks, built on the shared workflows of Mitchou10/github-workflow (pinned to @v0):
# commit messages, lint, tests, secret scan, config scan and a build check of every image that changed.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - "**"
  workflow_dispatch:

# Only the newest push to a pull request is worth building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    name: Detect changed paths
    uses: Mitchou10/github-workflow/.github/workflows/path-filter.yml@v0
    permissions:
      contents: read
      pull-requests: read
    with:
      FILTERS: |
        backend:
          - 'backend/**'
        vosk_service:
          - 'vosk_service/**'
        helm:
          - 'helm/**'
          - 'ci/configs/ct.yaml'
        ci:
          - '.github/workflows/**'
          - '.github/releases/**'
      ALWAYS: ci

  lint-commits:
    name: Lint commit messages
    if: ${{ !github.event.pull_request.draft && github.event_name == 'pull_request' }}
    uses: Mitchou10/github-workflow/.github/workflows/lint-commits.yml@v0
    permissions:
      contents: read

  lint-backend:
    name: Lint backend
    needs: paths
    if: ${{ contains(fromJSON(needs.paths.outputs.changed), 'backend') }}
    uses: Mitchou10/github-workflow/.github/workflows/python-lint.yml@v0
    permissions:
      contents: read
    with:
      WORKING_DIRECTORY: backend

  lint-vosk-service:
    name: Lint vosk_service
    needs: paths
    if: ${{ contains(fromJSON(needs.paths.outputs.changed), 'vosk_service') }}
    uses: Mitchou10/github-workflow/.github/workflows/python-lint.yml@v0
    permissions:
      contents: read
    with:
      WORKING_DIRECTORY: vosk_service

  # Chart lint (chart-testing + helm-docs), same shared workflow as the Muffin project.
  lint-helm:
    name: Lint Helm chart
    needs: paths
    if: ${{ contains(fromJSON(needs.paths.outputs.changed), 'helm') }}
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-helm.yml@v0
    permissions:
      contents: read
    with:
      CT_CONF_PATH: ci/configs/ct.yaml
      CHARTS_DIR: helm
      HELM_DOCS_VERSION: v1.14.2

  unit-tests-backend:
    name: Tests backend
    needs: paths
    if: ${{ contains(fromJSON(needs.paths.outputs.changed), 'backend') }}
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read
    with:
      PROJECT: backend

  unit-tests-vosk-service:
    name: Tests vosk_service
    needs: paths
    if: ${{ contains(fromJSON(needs.paths.outputs.changed), 'vosk_service') }}
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read
    with:
      PROJECT: vosk_service

  scan-gitleaks:
    name: Scan for leaked secrets
    if: ${{ !github.event.pull_request.draft }}
    uses: Mitchou10/github-workflow/.github/workflows/scan-gitleaks.yml@v0
    permissions:
      contents: read
      security-events: write
    with:
      FULL_HISTORY: true
      SECURITY_TAB: true

  scan-trivy-conf:
    name: Scan configuration (Trivy)
    if: ${{ !github.event.pull_request.draft }}
    uses: Mitchou10/github-workflow/.github/workflows/scan-trivy.yml@v0
    permissions:
      contents: read
      security-events: write
    with:
      SCAN_TYPE: config
      TARGET: .
      TRIVYIGNORES: .trivyignore.yaml
      SECURITY_TAB: true

  # The images are only built, not pushed. They are scanned for vulnerabilities after release, in cd.yml.
  build-backend:
    name: Build backend
    needs: paths
    if: ${{ contains(fromJSON(needs.paths.outputs.changed), 'backend') }}
    uses: Mitchou10/github-workflow/.github/workflows/build-docker.yml@v0
    permissions:
      contents: read
    with:
      IMAGE_NAME: local/backend
      IMAGE_TAG: ci
      CONTEXT: backend
      TARGET: runtime
      PUSH: false

  build-vosk-service:
    name: Build vosk-service
    needs: paths
    if: ${{ contains(fromJSON(needs.paths.outputs.changed), 'vosk_service') }}
    uses: Mitchou10/github-workflow/.github/workflows/build-docker.yml@v0
    permissions:
      contents: read
    with:
      IMAGE_NAME: local/vosk-service
      IMAGE_TAG: ci
      CONTEXT: vosk_service
      TARGET: runtime
      PUSH: false

  # Mark only this job as required in the branch protection.
  all-jobs-passed:
    name: Check jobs status
    if: ${{ always() }}
    needs:
      - paths
      - lint-commits
      - lint-backend
      - lint-vosk-service
      - lint-helm
      - unit-tests-backend
      - unit-tests-vosk-service
      - scan-gitleaks
      - scan-trivy-conf
      - build-backend
      - build-vosk-service
    uses: Mitchou10/github-workflow/.github/workflows/status-gate.yml@v0
    with:
      NEEDS: ${{ toJSON(needs) }}
