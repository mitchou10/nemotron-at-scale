name: Unit Tests

# Neither project needs a database, a model or a GPU to run its tests: the ASR servers are
# simulated, so no service containers are started here.

on:
  workflow_call:
    inputs:
      PROJECT:
        description: Project to test (backend or vosk_service)
        required: true
        type: string
      PYTHON_VERSION:
        description: Python version used to run the tests
        required: false
        type: string
        default: "3.12"
  workflow_dispatch:
    inputs:
      PROJECT:
        description: Project to test (backend or vosk_service)
        required: true
        type: string
      PYTHON_VERSION:
        description: Python version used to run the tests
        required: false
        type: string
        default: "3.12"

jobs:
  unit-tests:
    name: Tests ${{ inputs.PROJECT }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION || '3.12' }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.PROJECT }}/uv.lock

      - name: Install dependencies
        working-directory: ${{ inputs.PROJECT }}
        run: uv sync --extra dev

      - name: Run tests
        working-directory: ${{ inputs.PROJECT }}
        run: uv run pytest
