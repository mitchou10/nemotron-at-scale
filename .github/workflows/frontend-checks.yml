name: Frontend checks

# Lint, type check, unit tests and production build of the admin interface (frontend/).

on:
  workflow_call:
    inputs:
      NODE_VERSION:
        description: Node.js version
        required: false
        type: string
        default: "22"
  workflow_dispatch:
    inputs:
      NODE_VERSION:
        description: Node.js version
        required: false
        type: string
        default: "22"

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package manager (pnpm) and its version come from "packageManager" in package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.NODE_VERSION || '22' }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
