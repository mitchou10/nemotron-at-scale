# Environment "dev" on the DSO cluster (ArgoCD, Vault, CloudNativePG). Applied on top of
# common-values.yaml:
#
#   helm upgrade --install nemotron ./helm \
#     -f helm/values/common-values.yaml -f helm/values/dev-values.yaml -n <namespace>
#
# With ArgoCD, list common-values.yaml in `valueFiles` and put the content of this file in `values`.
# Same shape as the Muffin ingress: one host, /api/ to the backend and everything else to the front.
# The Service ports of this chart are 80 (they forward to the container ports 8000 and 8080).
#
# NOT verified against a live dev cluster: check the Vault paths and the CNPG cluster
# (`kubectl get cluster nemotron-pg-cluster -o yaml`) before relying on them.
global:
  env:
    ENVIRONMENT: "dev"
  ingress:
    # No className: the cluster default applies (set it, or add the annotations of the cluster,
    # such as the allowed source ranges, here if needed).
    className: ""
    hosts:
      - name: "nemotron-dev.example.com"
        paths:
          - pathType: "Prefix"
            path: "/api/"
            backend:
              serviceName: "nemotron-backend"
              portNumber: 80
          - pathType: "Prefix"
            path: "/"
            backend:
              serviceName: "nemotron-frontend"
              portNumber: 80

backend:
  # The PostgreSQL URL comes from Vault (nemotron-db-infos, computed below), not from the throwaway
  # database of common-values.yaml.
  env:
    DATABASE_URL:
      valueFrom:
        secretKeyRef:
          name: "nemotron-db-infos"
          key: "DATABASE_URL"
  # CNPG creates its Service a few moments after the Cluster: wait for it.
  initContainers:
    - name: wait-for-db
      image: "docker.io/library/busybox:1.37"
      command: ["sh", "-c", "until nc -z nemotron-pg-cluster-rw 5432; do echo 'waiting for the database'; sleep 2; done"]
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]

extraObjects:
  # The throwaway PostgreSQL of common-values.yaml is replaced by the CNPG cluster below.
  nemotron-database: null
  nemotron-db-service: null
  nemotron-db: null

  # Token the workers register with: Vault KV secret with a `token` key.
  nemotron-registry:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: nemotron-registry
    spec:
      vaultAuthRef: vault-auth
      mount: exploration
      path: dev/nemotron/registry
      type: kv-v2
      destination:
        name: nemotron-registry
        create: true

  # Credentials, one Vault KV secret each (mount "exploration", path dev/nemotron/<name>).
  # CNPG wants kubernetes.io/basic-auth secrets (username + password keys): an Opaque one makes the
  # Cluster wait forever.
  nemotron-db-superuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: nemotron-db-superuser
    spec:
      vaultAuthRef: vault-auth
      mount: exploration
      path: dev/nemotron/db-superuser
      type: kv-v2
      destination:
        name: nemotron-db-superuser
        create: true
        type: kubernetes.io/basic-auth
  nemotron-db-appuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: nemotron-db-appuser
    spec:
      vaultAuthRef: vault-auth
      mount: exploration
      path: dev/nemotron/db-appuser
      type: kv-v2
      destination:
        name: nemotron-db-appuser
        create: true
        type: kubernetes.io/basic-auth
  # Same Vault secret as the app user, reshaped into the DATABASE_URL the backend reads. The host
  # is the read-write Service of the CNPG cluster (`cnpg.fullnameOverride` + -rw). Assumes the
  # password has no URL-reserved characters: VSO templates cannot URL-encode.
  nemotron-db-infos:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: nemotron-db-infos
    spec:
      vaultAuthRef: vault-auth
      mount: exploration
      path: dev/nemotron/db-appuser
      type: kv-v2
      destination:
        name: nemotron-db-infos
        create: true
        transformation:
          excludes:
            - ".*"
          templates:
            DATABASE_URL:
              text: 'postgresql+asyncpg://{{ "{{" }} get .Secrets "username" {{ "}}" }}:{{ "{{" }} get .Secrets "password" {{ "}}" }}@nemotron-pg-cluster-rw:5432/nemotron'

cnpg:
  enabled: true
  fullnameOverride: "nemotron-pg-cluster"
  mode: "standalone"
  cluster:
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.7"
    instances: 1
    enableSuperuserAccess: true
    superuserSecret: "nemotron-db-superuser"
    initdb:
      database: "nemotron"
      owner: "nemotron"
      secret:
        name: "nemotron-db-appuser"
    storage:
      size: "10Gi"
    walStorage:
      enabled: true
      size: "5Gi"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
