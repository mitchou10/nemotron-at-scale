# Base for the DSO cluster (ArgoCD, Vault Secrets Operator, CloudNativePG), shared by every
# environment. An environment file (dev-values.yaml...) only sets what changes: host, Vault mount
# and path of each secret, size of the database. Order matters, the environment file comes last:
#
#   helm upgrade --install nemotron ./helm \
#     -f helm/values/common-values.yaml -f helm/values/dev-values.yaml -n <namespace>
#
# With ArgoCD, list common-values.yaml in `valueFiles` and put the content of the environment file
# in `values`. To try the chart on a local cluster instead, use local-values.yaml.
fullnameOverride: nemotron

global:
  imagePullSecrets:
    - name: "registry-pull-secret"
  # One host for the whole release, set by the environment file. /api/ goes to the backend and
  # everything else to the status page.
  ingress:
    enabled: true

backend:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "exploration/nemotron-backend"
    pullPolicy: "IfNotPresent"
  replicaCount: 1
  # The URL is computed by VSO from the Vault secret of the application user (nemotron-db-infos).
  env:
    DATABASE_URL:
      valueFrom:
        secretKeyRef:
          name: "nemotron-db-infos"
          key: "DATABASE_URL"
  # No wait for the database here: the schema is created by `jobs.migration` below, and the backend
  # retries until the CNPG Service answers.
  envCm:
    APP_ENV: "production"
    APP_DEBUG: "false"
    APP_LOG_LEVEL: "info"
    # Live transcription: the Vosk and TTS workers of this release register themselves in the backend
    # (REGISTRY_URL is set by the chart); the token is the Secret `nemotron-registry`.
    ASR_ENABLED: "true"
    ASR_STATE_STORE: "database"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

vosk:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "exploration/nemotron-vosk-service"
    pullPolicy: "IfNotPresent"
  envCm:
    # The small French model is downloaded on first start (a few seconds, ~40 MB).
    VOSK_MODEL_NAME: "vosk-model-small-fr-0.22"
    # Stream limit = CPU limit x VOSK_STREAMS_PER_CPU
    VOSK_STREAMS_PER_CPU: "3"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

tts:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "exploration/nemotron-tts-service"
    pullPolicy: "IfNotPresent"
  # The image ships fr_FR-siwis-medium: nothing is downloaded at start.
  envCm:
    TTS_VOICES: "fr_FR-siwis-medium"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

frontend:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "exploration/nemotron-frontend"
    pullPolicy: "IfNotPresent"

# `alembic upgrade head`: the backend image only runs uvicorn (docker-compose runs alembic itself),
# so on Kubernetes the schema has to be created by this job. It runs AFTER the resources are
# applied (`post-install`, `post-upgrade`; PostSync in ArgoCD): it needs the ServiceAccount, the
# `nemotron-db-infos` Secret and the CNPG cluster, none of which exist yet before the sync. The
# backend health routes do not touch the database, so the release becomes healthy without the schema
# and the hook can run. Do not use `pre-upgrade`: ArgoCD maps it to PreSync, which fails on a first
# sync (ServiceAccount not found).
jobs:
  migration:
    hook:
      enabled: true
      types:
        - "post-install"
        - "post-upgrade"
      weight: 0
      deletePolicy: "before-hook-creation,hook-succeeded"
    image:
      registry: "harbor.sdid.cpin.numerique-interieur.com"
      repository: "exploration/nemotron-backend"
      pullPolicy: "IfNotPresent"
    command: ["alembic"]
    args: ["upgrade", "head"]
    envFrom:
      - secretRef:
          name: "nemotron-db-infos"
    serviceAccount:
      enabled: true
      create: true
    # A failed migration is retried at most twice, and a stuck one is stopped after 15 minutes
    # instead of blocking the release until the timeout.
    backoffLimit: 2
    activeDeadlineSeconds: 900
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: "RuntimeDefault"
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
    initContainers:
      - name: wait-for-postgres
        # Same image as the migration (already pulled, no dependency on docker.io). Polls the TCP
        # port of the host alembic will really use; alembic then fails fast if PostgreSQL is not
        # really ready.
        image: "harbor.sdid.cpin.numerique-interieur.com/exploration/nemotron-backend:{{ .Chart.AppVersion }}"
        imagePullPolicy: "IfNotPresent"
        command:
          - "python"
          - "-c"
          - |-
            import os,socket,time
            from urllib.parse import urlsplit
            u = urlsplit(os.environ['DATABASE_URL'])
            print(f'Waiting for PostgreSQL at {u.hostname}:{u.port or 5432}', flush=True)
            while True:
                try:
                    socket.create_connection((u.hostname, u.port or 5432), 2).close()
                    break
                except OSError:
                    time.sleep(1)
            print('PostgreSQL reachable', flush=True)
        envFrom:
          - secretRef:
              name: "nemotron-db-infos"
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: "RuntimeDefault"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
    resources:
      requests:
        cpu: "250m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

# Each secret is a Vault KV v2 secret read by VSO. The environment file gives `spec.mount` and
# `spec.path` (dev/nemotron/<name>).
extraObjects:
  # Token the workers register with: key `token`.
  nemotron-registry:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: nemotron-registry
    spec:
      vaultAuthRef: vault-auth
      type: kv-v2
      destination:
        name: nemotron-registry
        create: true
  # Token of the admin interface: key `token`.
  nemotron-admin:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: nemotron-admin
    spec:
      vaultAuthRef: vault-auth
      type: kv-v2
      destination:
        name: nemotron-admin
        create: true
  # CNPG wants kubernetes.io/basic-auth secrets (keys `username` and `password`): an Opaque one
  # (the VSO default) makes the Cluster wait forever.
  nemotron-db-superuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: nemotron-db-superuser
    spec:
      vaultAuthRef: vault-auth
      type: kv-v2
      destination:
        name: nemotron-db-superuser
        create: true
        type: kubernetes.io/basic-auth
  nemotron-db-appuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: nemotron-db-appuser
    spec:
      vaultAuthRef: vault-auth
      type: kv-v2
      destination:
        name: nemotron-db-appuser
        create: true
        type: kubernetes.io/basic-auth
  # Same Vault secret as the application user, reshaped into the DATABASE_URL the backend reads.
  # The host is the read-write Service of the CNPG cluster (`cnpg.fullnameOverride` + -rw). Assumes
  # the password has no URL-reserved characters: VSO templates cannot URL-encode.
  nemotron-db-infos:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: nemotron-db-infos
    spec:
      vaultAuthRef: vault-auth
      type: kv-v2
      destination:
        name: nemotron-db-infos
        create: true
        transformation:
          excludes:
            - ".*"
          templates:
            DATABASE_URL:
              text: 'postgresql+asyncpg://{{ "{{" }} get .Secrets "username" {{ "}}" }}:{{ "{{" }} get .Secrets "password" {{ "}}" }}@nemotron-pg-cluster-rw:5432/nemotron'

cnpg:
  enabled: true
  fullnameOverride: "nemotron-pg-cluster"
  mode: "standalone"
  cluster:
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.7"
    enableSuperuserAccess: true
    superuserSecret: "nemotron-db-superuser"
    initdb:
      database: "nemotron"
      owner: "nemotron"
      secret:
        name: "nemotron-db-appuser"
    # The quota (dso-quota) refuses any container without requests and limits. CNPG also applies
    # these to the `bootstrap-controller` and `initdb` containers of the initialisation job, so they
    # must be here and not only in the environment file. An environment can still resize them.
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
