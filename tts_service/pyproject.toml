[project]
name = "tts-service"
version = "0.2.0"
description = "Standalone text-to-speech server (Piper) with an OpenAI-compatible /v1/audio/speech route"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "piper-tts>=1.3.0",
    "lameenc>=1.7.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q --cov=app --cov-report=term-missing"

[tool.coverage.run]
omit = ["app/piper_engine.py"]
